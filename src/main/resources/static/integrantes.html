<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Integrantes</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input { padding: 5px; width: 300px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

<h2>Cadastrar Novo Integrante</h2>

<form id="form-integrante">
    <div class="form-group">
        <label for="nome">Nome do Integrante:</label>
        <input type="text" id="nome" required>
    </div>

    <div class="form-group">
        <label for="funcao">Função (Ex: Ala, Armador, Pivo):</label>
        <input type="text" id="funcao" required>
    </div>

    <button type="submit">Salvar Integrante</button>
</form>

<script>
    document.getElementById('form-integrante').addEventListener('submit', async function(event) {
        event.preventDefault(); // Evita recarregar a página

        const payload = {
            nome: document.getElementById('nome').value,
            funcao: document.getElementById('funcao').value
        };

        try {
            const response = await fetch('/integrantes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert('Integrante cadastrado com sucesso!');
                document.getElementById('form-integrante').reset();
            } else {
                alert('Erro ao cadastrar integrante.');
            }
        } catch (error) {
            console.error("Erro:", error);
            alert('Erro de conexão com a API.');
        }
    });
</script>
</body>
</html>
